<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    Favicon. The full 220x100 lockup is illegible at 16px, so the mark is
    centred in a square with a graphite plate behind it - the gold needs a dark
    ground to stay visible against both light and dark browser chrome.
    Stroke is thickened relative to the master (18 vs 14.5) because hairlines
    disappear at favicon scale.
  -->
  <rect width="100" height="100" rx="22" fill="#121110"/>
  <g transform="translate(50 50) scale(0.345) translate(-110 -50)">
    <g stroke="#C6A664" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="10">
      <path d="M 7.25 7.25 L 67.25 7.25 L 110 50 L 67.25 92.75 L 7.25 92.75 Z"/>
      <path d="M 212.75 7.25 L 152.75 7.25 L 110 50 L 152.75 92.75 L 212.75 92.75 Z"/>
    </g>
  </g>
</svg>
