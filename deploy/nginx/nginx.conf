# =============================================================================
# Elite Algos Labs — nginx front end
# -----------------------------------------------------------------------------
# Terminates TLS, serves the ACME challenge, compresses responses, and proxies
# everything else to the Next.js container.
#
# Compression lives here rather than in Next.js (`compress: false` in
# next.config.ts) — doing it in both wastes CPU on every request.
# =============================================================================

upstream elite_app {
    server web:3000;
    keepalive 32;
}

# --- HTTP: ACME challenge + redirect ----------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name elitealgoslabs.com www.elitealgoslabs.com;

    # Must stay on plain HTTP — Let's Encrypt validates over port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://elitealgoslabs.com$request_uri;
    }
}

# --- HTTPS: canonical host redirect -----------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.elitealgoslabs.com;

    ssl_certificate     /etc/letsencrypt/live/elitealgoslabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elitealgoslabs.com/privkey.pem;

    # One canonical host. Serving both would split SEO signals and make the
    # `hreflang` alternates ambiguous.
    return 301 https://elitealgoslabs.com$request_uri;
}

# --- HTTPS: the application -------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name elitealgoslabs.com;

    ssl_certificate     /etc/letsencrypt/live/elitealgoslabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elitealgoslabs.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # HSTS. Two years, subdomains included. Note: once a browser has seen this
    # header it will refuse plain HTTP for this host until it expires — do not
    # enable `preload` until the certificate renewal has proven itself.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 12m;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml
                      application/manifest+json;

    # Immutable build assets: content-hashed filenames, so cache them hard.
    location /_next/static/ {
        proxy_pass http://elite_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        proxy_pass http://elite_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The command center must never be cached by any intermediary.
    location ~ ^/(en|fr)/admin {
        proxy_pass http://elite_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        proxy_pass http://elite_app;
        proxy_http_version 1.1;

        # X-Forwarded-For carries the real client address, which the contact
        # endpoint and login throttle both key on. Without it every visitor
        # shares one rate-limit bucket.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }
}
